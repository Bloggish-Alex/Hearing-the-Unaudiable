<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Climate Sonification</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff6b4a'/%3E%3Cpath d='M10 20c4-8 8-8 12 0' stroke='%23080d18' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./player.css">
  </head>
  <body>
    <div class="app">
      <header id="apptitle" class="app-title"></header>
      <section id="summary" class="summary" aria-live="polite"></section>

      <section class="panel readout-panel">
        <div class="panel-label">READOUT</div>
        <div id="readout" class="readout"></div>
      </section>

      <section id="legend" class="legend" aria-label="Voices"></section>
      <footer id="notes" class="notes"></footer>
    </div>

    <script src="./player_data.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script>
      // Report this page's height to the parent page so an embedding iframe
      // (AstroWeb) can size itself. Invisible to the player.
      (function () {
        if (window.parent === window) {
          return;
        }

        const content = document.querySelector(".app");
        const send = () => parent.postMessage(
          { type: "embed-height", height: Math.ceil(content.getBoundingClientRect().height) },
          "*",
        );

        addEventListener("message", (event) => {
          if (event.data && event.data.type === "embed-ping") {
            send();
          }
        });

        addEventListener("load", send);
        addEventListener("resize", send);
        
        new ResizeObserver(send).observe(content);
        send();
      })();
    </script>
  </body>
</html>
